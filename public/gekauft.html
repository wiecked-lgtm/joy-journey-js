<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Danke | Etsy-Gewinnrechner</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap">
<style>
:root{--bg:#F6F8F7;--surface:#FFFFFF;--line:#DCE5E3;--fg:#1E3436;--muted:#4F6365;--pine:#224D51;--mint:#E3F4EA;--green:#1F7A55;--sand:#FFF4D6;--sand-line:#D9B45B;--sand-fg:#6B4A00}
@media (prefers-color-scheme: dark){:root{--bg:#122224;--surface:#1A2F31;--line:#2C4447;--fg:#E6EFED;--muted:#A3B7B4;--pine:#8DB5A6;--mint:#1D3A33;--green:#7FD1A8;--sand:#3A3220;--sand-line:#9C8445;--sand-fg:#F0D58E;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,sans-serif;font-size:17px;line-height:1.6;padding:48px 16px}
.card{max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px;display:flex;flex-direction:column;gap:16px}
.badge{align-self:flex-start;background:var(--mint);color:var(--green);font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px}
h1{margin:0;font-size:30px;line-height:1.2;color:var(--pine)}
p{margin:0}
.btn{align-self:flex-start;display:inline-block;font-weight:800;text-decoration:none;color:var(--sand-fg);background:var(--sand);border:1.5px solid var(--sand-line);border-radius:10px;padding:14px 22px}
.small{font-size:14px;color:var(--muted)}
a{color:var(--pine)}
</style>
</head>
<body>
<main class="card">
  <span class="badge">Danke für deinen Kauf</span>
  <h1>Ab jetzt bekommst du keine Kaufhinweise mehr.</h1>
  <p>In wenigen Minuten schicke ich dir eine kurze Mail mit dem Link zur Kurzanleitung. Damit ist der Rechner in unter 15 Minuten eingerichtet.</p>
  <p class="small">Fragen zum Rechner? Schreib mir an <a href="mailto:mail@stephanie-wieck.com">mail@stephanie-wieck.com</a>.</p>
</main>
</body>
</html>
